# Run by the global core.hooksPath dispatcher (see docs/development.md); `prek run` runs by hand.
# Every hook is a local system command so the tool versions are the ones on the machine, the same
# ones scripts/check.sh uses.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        files: (\.rs$|(^|/)Cargo\.(toml|lock)$|^(clippy|rustfmt)\.toml$)
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        files: (\.rs$|(^|/)Cargo\.(toml|lock)$|^(clippy|rustfmt)\.toml$)
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: shfmt
        name: shfmt
        entry: shfmt -d
        language: system
        types: [shell]
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: zizmor
        language: system
        files: ^\.github/(workflows/|dependabot\.yml$)
      - id: changelog
        name: feat and fix commits update CHANGELOG.md
        entry: scripts/changelog-check.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
