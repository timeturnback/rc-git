[workspace]
resolver = "3"
members = [
    "crates/rc-git-core",
    "crates/rc-git-guard",
    "crates/rc-git-highlight",
    "crates/rc-git-cli",
    "crates/rc-git-testkit",
    "crates/rc-git-kit",
    "crates/rc-git-app",
    "crates/rc-git-mac",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/timeturnback/rc-git"

[workspace.dependencies]
rc-git-core = { path = "crates/rc-git-core" }
rc-git-guard = { path = "crates/rc-git-guard" }
rc-git-highlight = { path = "crates/rc-git-highlight" }
rc-git-testkit = { path = "crates/rc-git-testkit" }
rc-git-kit = { path = "crates/rc-git-kit" }
rc-git-mac = { path = "crates/rc-git-mac" }
gix = { version = "=0.87.1", default-features = false, features = ["max-performance", "revision", "sha1", "auto-chain-error", "blob-diff", "blame", "excludes", "index"] }
# Must equal the gix-transport that gix resolves to; used only as a dev-dependency.
gix-transport = { version = "=0.59.2", default-features = false }
gix-pack = { version = "=0.74.2", default-features = false, features = ["generate"] }
memchr = "=2.8.3"
thiserror = "=2.0.20"
anyhow = "=1.0.104"
tempfile = "=3.27.0"
russh = { version = "=0.63.3", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-config = "=0.58.0"
# HMAC-SHA1 for hashed `|1|` known_hosts entries: the versions russh already pulls in.
hmac = { version = "=0.13.0", default-features = false }
sha1 = { version = "=0.11.0", default-features = false }
# Safe SIGINT/SIGTERM registration for the CLI's remote verbs; the CLI forbids `unsafe`.
signal-hook = { version = "=0.4.5", default-features = false }
# NFC folding for search keys (Swift precomposedStringWithCanonicalMapping); already in gix's tree.
unicode-normalization = { version = "=0.1.25", default-features = false, features = ["std"] }
# tsconfig.json reading: comments and trailing commas (Swift JSONSerialization .json5Allowed).
jsonc-parser = { version = "=0.34.0", default-features = false }
# UI (crates/rc-git-kit, rc-git-app). gpui-pre is a weekly crates.io snapshot of Zed's gpui;
# gpui-component pins it. Bump the four together. font-kit is required for glyphs on macOS;
# runtime_shaders compiles Metal shaders at launch, so the build needs no Metal Toolchain.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "runtime_shaders"] }
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.11", features = ["font-kit", "runtime_shaders"] }
gpui-component = "=0.9.0"
# Lucide icons; gpui-component already depends on it at this version, so it adds no crate.
gpui-kit-assets = "=0.9.0"
tokio = { version = "=1.53.3", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic prevention
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
# No cheating
allow_attributes = "deny"
# Code hygiene
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Safety
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
# Pedantic relaxations (too noisy)
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The dev bundle's Rust library (scripts/build.sh debug): release minus fat LTO, with parallel
# and incremental codegen, so a one-line core edit relinks in seconds instead of a minute.
[profile.app-dev]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
