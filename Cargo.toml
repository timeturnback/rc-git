[workspace]
resolver = "3"
members = [
    "crates/rc-git-core",
    "crates/rc-git-guard",
    "crates/rc-git-highlight",
    "crates/rc-git-ffi",
    "crates/rc-git-cli",
    "crates/rc-git-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/timeturnback/rc-git"

[workspace.dependencies]
rc-git-core = { path = "crates/rc-git-core" }
rc-git-guard = { path = "crates/rc-git-guard" }
rc-git-highlight = { path = "crates/rc-git-highlight" }
rc-git-testkit = { path = "crates/rc-git-testkit" }
gix = { version = "=0.87.1", default-features = false, features = ["max-performance", "revision", "sha1", "auto-chain-error", "blob-diff", "blame", "excludes", "index"] }
gix-protocol = { version = "=0.65.1", default-features = false, features = ["blocking-client"] }
gix-packetline = "=0.22.2"
gix-pack = { version = "=0.74.2", default-features = false, features = ["generate"] }
memchr = "=2.8.3"
thiserror = "=2.0.20"
anyhow = "=1.0.104"
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic prevention
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
# No cheating
allow_attributes = "deny"
# Code hygiene
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Safety
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
# Pedantic relaxations (too noisy)
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
