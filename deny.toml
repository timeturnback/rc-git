# cargo-deny: supply-chain gate. `cargo deny check` runs in scripts/check.sh and CI.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Marvin Attack on the `rsa` crate (russh's id_rsa support). No fixed release exists.
  # A timing side channel needing many observed private-key operations; rc-git performs
  # one interactive ssh signature per sync on a desktop, so the oracle is not exposed.
  "RUSTSEC-2023-0071",
]

[licenses]
version = 2
# Only licenses that actually occur in the tree; an unused entry is a warning. MPL-2.0 is
# file-level copyleft (uluru, gix's LRU cache) and imposes nothing on the app. BSD-3-Clause
# rides in with encoding_rs (gix-blame's text decoding); permissive, attribution only.
# ISC rides in with ring/untrusted (russh's crypto backend); permissive, attribution only.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "ISC",
]

[bans]
# Duplicate versions come from gix's transitive tree and are not actionable here.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
