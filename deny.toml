# cargo-deny: supply-chain gate. `cargo deny check` runs in scripts/check.sh and CI.

[graph]
all-features = true
# rc-git ships for macOS only. GPUI's Linux, Windows and wasm backends never build here.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin Attack on the `rsa` crate (russh's id_rsa support). No fixed release exists.
    # A timing side channel needing many observed private-key operations; rc-git performs
    # one interactive ssh signature per sync on a desktop, so the oracle is not exposed.
    "RUSTSEC-2023-0071",
    # Unmaintained, no vulnerability; reached only through GPUI and gpui-component, which pin
    # them. Re-check on each GPUI bump.
    "RUSTSEC-2024-0384", # instant (gpui-component, gpui-base)
    "RUSTSEC-2024-0436", # paste (gpui-component)
    "RUSTSEC-2026-0206", # rustybuzz (usvg, SVG icons)
    "RUSTSEC-2026-0192", # ttf-parser (fontdb, usvg)
]

[licenses]
version = 2
# Only licenses that actually occur in the tree; an unused entry is a warning. MPL-2.0 is
# file-level copyleft (uluru, gix's LRU cache) and imposes nothing on the app. BSD-3-Clause is
# required by encoding_rs (`(Apache-2.0 OR MIT) AND BSD-3-Clause`, via gix-filter through gix
# and gix-diff) and is the only license of russh's curve25519-dalek, ed25519-dalek and subtle;
# permissive, attribution only.
# ISC rides in with ring/untrusted (russh's crypto backend); permissive, attribution only.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "ISC",
    # GPUI's tree: arrayref (tiny-skia), enum-iterator (gpui-component), notify (gpui-component).
    "BSD-2-Clause",
    "0BSD",
    "CC0-1.0",
]

[licenses.private]
# The workspace crates are `publish = false` and carry no license field: the project is not
# licensed for redistribution. Skip them; every third-party crate is still checked.
ignore = true

[bans]
# Duplicate versions come from gix's tree (sha1/digest 0.10) and from russh's pre-release
# RustCrypto stack (digest/sha1 0.11, getrandom 0.2 via ring). Neither set is actionable until
# upstream aligns.
multiple-versions = "allow"
# A second gix-transport means a dev-only pin drifted from the one gix resolves.
deny = [{ crate = "gix-transport", deny-multiple-versions = true }]
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
