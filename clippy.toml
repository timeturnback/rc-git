# rc-git never mutates a repository from library code and never shells out.
# Every method here is a write path, a process spawn, a network entry point, or a
# resolver that bypasses the guard's own (branch_remote* skips the origin fallback).
# Adding a caller means routing it through rc-git-guard first; see docs/safety.md.
disallowed-methods = [
    { path = "gix::Repository::edit_reference", reason = "core is read-only; ref writes go through rc-git-guard" },
    { path = "gix::Repository::edit_references", reason = "core is read-only; ref writes go through rc-git-guard" },
    { path = "gix::Repository::edit_references_as", reason = "core is read-only; ref writes go through rc-git-guard" },
    { path = "gix::Repository::reference", reason = "core is read-only; ref writes go through rc-git-guard" },
    { path = "gix::Repository::tag_reference", reason = "core is read-only; ref writes go through rc-git-guard" },
    { path = "gix::Repository::tag", reason = "core is read-only; object writes go through rc-git-guard" },
    { path = "gix::Repository::commit", reason = "core is read-only; object writes go through rc-git-guard" },
    { path = "gix::Repository::commit_as", reason = "core is read-only; object writes go through rc-git-guard" },
    { path = "gix::Repository::write_object", reason = "core is read-only; object writes go through rc-git-guard" },
    { path = "gix::Repository::write_blob", reason = "core is read-only; object writes go through rc-git-guard" },
    { path = "gix::Repository::write_blob_stream", reason = "core is read-only; object writes go through rc-git-guard" },
    { path = "gix::Repository::worktree", reason = "worktree reads go through crate::worktree, which uses std::fs reads only" },
    { path = "std::process::Command::new", reason = "never shell out to git; use gix. Test fixtures may expect() this lint with a reason" },
    { path = "std::fs::remove_file", reason = "core never deletes; see docs/safety.md" },
    { path = "std::fs::remove_dir", reason = "core never deletes; see docs/safety.md" },
    { path = "std::fs::remove_dir_all", reason = "core never deletes; see docs/safety.md" },
    { path = "std::fs::write", reason = "core never writes files; see docs/safety.md" },
    { path = "std::fs::File::create", reason = "core never writes files; see docs/safety.md" },
    { path = "std::fs::OpenOptions::open", reason = "core never writes files, and these options may open one for writing; reads use std::fs::read or File::open. See docs/safety.md" },
    { path = "std::fs::rename", reason = "core never moves files; see docs/safety.md" },
    { path = "std::fs::create_dir", reason = "core never writes files; see docs/safety.md" },
    { path = "std::fs::create_dir_all", reason = "core never writes files; see docs/safety.md" },
    { path = "std::fs::set_permissions", reason = "core never writes files; see docs/safety.md" },
    { path = "std::os::unix::fs::symlink", reason = "core never writes files; see docs/safety.md" },
    { path = "gix_index::File::write", reason = "core is read-only; index writes go through rc-git-guard" },
    { path = "gix_index::File::write_to", reason = "core is read-only; index writes go through rc-git-guard" },
    { path = "gix::Repository::remote_at", reason = "network entry point; remote I/O goes through rc-git-guard" },
    { path = "gix::Repository::find_remote", reason = "network entry point; remote I/O goes through rc-git-guard" },
    { path = "gix::Repository::find_fetch_remote", reason = "network entry point; remote I/O goes through rc-git-guard" },
    { path = "gix::Remote::connect", reason = "network entry point; remote I/O goes through rc-git-guard" },
    { path = "gix::Remote::to_connection_with_transport", reason = "network entry point; remote I/O goes through rc-git-guard" },
    { path = "gix::remote::fetch::Prepare::receive", reason = "writes the received pack and the tracking refs; only rc-git-guard run_fetch, which holds a Writer, may call it" },
    { path = "gix_protocol::handshake", reason = "network entry point; remote I/O goes through rc-git-guard" },
    { path = "gix_transport::client::blocking_io::connect::connect", reason = "network entry point; remote I/O goes through rc-git-guard" },
    { path = "gix_object::Write::write", reason = "core is read-only; object writes go through rc-git-guard" },
    { path = "gix_object::Write::write_buf", reason = "core is read-only; object writes go through rc-git-guard" },
    { path = "gix_object::Write::write_stream", reason = "core is read-only; object writes go through rc-git-guard" },
    { path = "gix_object::Write::write_buf_with_known_id", reason = "core is read-only; object writes go through rc-git-guard" },
    { path = "gix_ref::file::Store::transaction", reason = "core is read-only; ref writes go through rc-git-guard" },
    { path = "gix::Reference::delete", reason = "core is read-only; ref writes go through rc-git-guard" },
    { path = "gix::Reference::set_target_id", reason = "core is read-only; ref writes go through rc-git-guard" },
