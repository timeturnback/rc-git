    { path = "gix::object::tree::editor::Cursor::write", reason = "core is read-only; object writes go through rc-git-guard" },
    { path = "gix::init", reason = "core is read-only; repository creation goes through rc-git-guard" },
    { path = "gix::init_bare", reason = "core is read-only; repository creation goes through rc-git-guard" },
    { path = "gix_lock::File::acquire_to_update_resource", reason = "core is read-only; lock-file writes go through rc-git-guard" },
    { path = "gix_lock::File::acquire_to_update_resource_with_permissions", reason = "core is read-only; lock-file writes go through rc-git-guard" },
    { path = "gix_lock::Marker::acquire_to_hold_resource", reason = "core is read-only; lock-file writes go through rc-git-guard" },
    { path = "gix_lock::Marker::acquire_to_hold_resource_with_permissions", reason = "core is read-only; lock-file writes go through rc-git-guard" },
    { path = "gix_lock::File::commit", reason = "core is read-only; lock-file writes go through rc-git-guard" },
    { path = "gix_lock::Marker::commit", reason = "core is read-only; lock-file writes go through rc-git-guard" },
    { path = "std::fs::copy", reason = "core never writes files; see docs/safety.md" },
    { path = "std::fs::hard_link", reason = "core never writes files; see docs/safety.md" },
    { path = "std::fs::File::create_new", reason = "core never writes files; see docs/safety.md" },
    { path = "std::fs::DirBuilder::create", reason = "core never writes files; see docs/safety.md" },
    { path = "std::fs::File::set_permissions", reason = "core never writes files; see docs/safety.md" },
    { path = "std::fs::File::set_times", reason = "core never writes files; see docs/safety.md" },
    { path = "std::fs::File::set_modified", reason = "core never writes files; see docs/safety.md" },
    { path = "std::os::unix::fs::chown", reason = "core never writes files; see docs/safety.md" },
    { path = "std::os::unix::fs::fchown", reason = "core never writes files; see docs/safety.md" },
    { path = "std::os::unix::fs::lchown", reason = "core never writes files; see docs/safety.md" },
    { path = "tokio::process::Command::new", reason = "never shell out to git; use gix. Test fixtures may expect() this lint with a reason" },
    { path = "std::net::TcpStream::connect", reason = "network entry point; remote I/O goes through rc-git-guard" },
    { path = "std::net::TcpStream::connect_timeout", reason = "network entry point; remote I/O goes through rc-git-guard" },
    { path = "tokio::net::TcpStream::connect", reason = "network entry point; remote I/O goes through rc-git-guard" },
    { path = "tokio::net::lookup_host", reason = "network entry point (DNS); remote I/O goes through rc-git-guard" },
    { path = "russh::client::connect", reason = "network entry point; remote I/O goes through rc-git-guard" },
    { path = "russh::client::connect_stream", reason = "network entry point; remote I/O goes through rc-git-guard" },
    { path = "russh::keys::agent::client::AgentClient::connect_uds", reason = "ssh-agent socket; the agent signs on the user's behalf, so only rc-git-guard connect_agent may open it" },
    { path = "russh::keys::agent::client::AgentClient::connect_env", reason = "ssh-agent socket from SSH_AUTH_SOCK; the agent signs on the user's behalf, so only rc-git-guard connect_agent may open it" },
    { path = "russh::keys::known_hosts::learn_known_hosts", reason = "known_hosts is read-only; approvals live app-side" },
    { path = "russh::keys::known_hosts::learn_known_hosts_path", reason = "known_hosts is read-only; approvals live app-side" },
    { path = "gix::Repository::branch_remote_ref_name", reason = "skips the origin fallback; use configured_remote_name / tracking_ref_name in rc-git-guard actions/remote.rs" },
    { path = "gix::Repository::branch_remote_tracking_ref_name", reason = "skips the origin fallback; use configured_remote_name / tracking_ref_name in rc-git-guard actions/remote.rs" },
    { path = "gix::Repository::branch_remote_name", reason = "skips the origin fallback; use configured_remote_name / tracking_ref_name in rc-git-guard actions/remote.rs" },
    { path = "gix::Repository::branch_remote", reason = "skips the origin fallback; use configured_remote_name / tracking_ref_name in rc-git-guard actions/remote.rs" },
    # libcurl, called directly: only the GitHub API client may, in one function that fixes
    # https-only, no redirects, the body cap and the timeouts (see docs/safety.md, "GitHub API").
    { path = "curl::easy::Easy::new", reason = "network entry point; only rc-git-guard actions/remote/github/http.rs talks curl" },
    { path = "curl::easy::Easy2::new", reason = "network entry point; only rc-git-guard actions/remote/github/http.rs talks curl" },
    { path = "curl::multi::Multi::new", reason = "network entry point; only rc-git-guard actions/remote/github/http.rs talks curl" },
    # The transport rules themselves. Nothing anywhere may call these: certificate and host
    # checks stay at curl's default (on), no CA can be added, and credentials never follow a
    # redirect.
    { path = "curl::easy::Easy::ssl_verify_peer", reason = "TLS peer verification is never switched off" },
    { path = "curl::easy::Easy2::ssl_verify_peer", reason = "TLS peer verification is never switched off" },
    { path = "curl::easy::Easy::ssl_verify_host", reason = "TLS host verification is never switched off" },
    { path = "curl::easy::Easy2::ssl_verify_host", reason = "TLS host verification is never switched off" },
    { path = "curl::easy::Easy::proxy_ssl_verify_peer", reason = "TLS peer verification is never switched off" },
    { path = "curl::easy::Easy2::proxy_ssl_verify_peer", reason = "TLS peer verification is never switched off" },
    { path = "curl::easy::Easy::proxy_ssl_verify_host", reason = "TLS host verification is never switched off" },
    { path = "curl::easy::Easy2::proxy_ssl_verify_host", reason = "TLS host verification is never switched off" },
    { path = "curl::easy::Easy::ssl_options", reason = "TLS options (revocation checks, ...) stay at curl's defaults" },
    { path = "curl::easy::Easy2::ssl_options", reason = "TLS options (revocation checks, ...) stay at curl's defaults" },
    { path = "curl::easy::Easy::proxy_ssl_options", reason = "TLS options (revocation checks, ...) stay at curl's defaults" },
    { path = "curl::easy::Easy2::proxy_ssl_options", reason = "TLS options (revocation checks, ...) stay at curl's defaults" },
    { path = "curl::easy::Easy::cainfo", reason = "no CA beyond the system's is ever trusted" },
    { path = "curl::easy::Easy2::cainfo", reason = "no CA beyond the system's is ever trusted" },
    { path = "curl::easy::Easy::capath", reason = "no CA beyond the system's is ever trusted" },
    { path = "curl::easy::Easy2::capath", reason = "no CA beyond the system's is ever trusted" },
    { path = "curl::easy::Easy::ssl_cainfo_blob", reason = "no CA beyond the system's is ever trusted" },
    { path = "curl::easy::Easy2::ssl_cainfo_blob", reason = "no CA beyond the system's is ever trusted" },
    { path = "curl::easy::Easy::proxy_cainfo", reason = "no CA beyond the system's is ever trusted" },
    { path = "curl::easy::Easy2::proxy_cainfo", reason = "no CA beyond the system's is ever trusted" },
    { path = "curl::easy::Easy::unrestricted_auth", reason = "credentials never follow a redirect to another host" },
    { path = "curl::easy::Easy2::unrestricted_auth", reason = "credentials never follow a redirect to another host" },
    { path = "curl::easy::Easy::proxy_capath", reason = "no CA beyond the system's is ever trusted" },
    { path = "curl::easy::Easy2::proxy_capath", reason = "no CA beyond the system's is ever trusted" },
    { path = "curl::easy::Easy::proxy_ssl_cainfo_blob", reason = "no CA beyond the system's is ever trusted" },
    { path = "curl::easy::Easy2::proxy_ssl_cainfo_blob", reason = "no CA beyond the system's is ever trusted" },
    { path = "curl::easy::Easy::doh_ssl_verify_peer", reason = "TLS peer verification is never switched off" },
    { path = "curl::easy::Easy2::doh_ssl_verify_peer", reason = "TLS peer verification is never switched off" },
    { path = "curl::easy::Easy::doh_ssl_verify_host", reason = "TLS host verification is never switched off" },
    { path = "curl::easy::Easy2::doh_ssl_verify_host", reason = "TLS host verification is never switched off" },
    { path = "curl::easy::Easy::ssl_version", reason = "the TLS versions stay at curl's defaults; none older is allowed" },
    { path = "curl::easy::Easy2::ssl_version", reason = "the TLS versions stay at curl's defaults; none older is allowed" },
    { path = "curl::easy::Easy::ssl_min_max_version", reason = "the TLS versions stay at curl's defaults; none older is allowed" },
    { path = "curl::easy::Easy2::ssl_min_max_version", reason = "the TLS versions stay at curl's defaults; none older is allowed" },
    { path = "curl::easy::Easy::proxy_ssl_version", reason = "the TLS versions stay at curl's defaults; none older is allowed" },
    { path = "curl::easy::Easy2::proxy_ssl_version", reason = "the TLS versions stay at curl's defaults; none older is allowed" },
    { path = "curl::easy::Easy::proxy_ssl_min_max_version", reason = "the TLS versions stay at curl's defaults; none older is allowed" },
    { path = "curl::easy::Easy2::proxy_ssl_min_max_version", reason = "the TLS versions stay at curl's defaults; none older is allowed" },
    { path = "curl::easy::Easy::ssl_cipher_list", reason = "the TLS ciphers stay at curl's defaults" },
    { path = "curl::easy::Easy2::ssl_cipher_list", reason = "the TLS ciphers stay at curl's defaults" },
    { path = "curl::easy::Easy::proxy_ssl_cipher_list", reason = "the TLS ciphers stay at curl's defaults" },
    { path = "curl::easy::Easy2::proxy_ssl_cipher_list", reason = "the TLS ciphers stay at curl's defaults" },
    { path = "curl::easy::Easy::ssl_engine", reason = "TLS crypto stays curl's own; no engine is loaded" },
    { path = "curl::easy::Easy2::ssl_engine", reason = "TLS crypto stays curl's own; no engine is loaded" },
    { path = "curl::easy::Easy::ssl_engine_default", reason = "TLS crypto stays curl's own; no engine is loaded" },
    { path = "curl::easy::Easy2::ssl_engine_default", reason = "TLS crypto stays curl's own; no engine is loaded" },
    { path = "curl::easy::Easy::random_file", reason = "TLS entropy stays the library's own" },
    { path = "curl::easy::Easy2::random_file", reason = "TLS entropy stays the library's own" },
    { path = "curl::easy::Easy::egd_socket", reason = "TLS entropy stays the library's own" },
    { path = "curl::easy::Easy2::egd_socket", reason = "TLS entropy stays the library's own" },
    # curl writes every header it sends, Authorization included, to stderr when verbose.
    { path = "curl::easy::Easy::verbose", reason = "verbose output prints the Authorization header" },
    { path = "curl::easy::Easy2::verbose", reason = "verbose output prints the Authorization header" },
    # The token travels only in the Authorization header the client builds, to the URL's host.
    { path = "curl::easy::Easy::username", reason = "credentials travel only in the client's own Authorization header" },
    { path = "curl::easy::Easy2::username", reason = "credentials travel only in the client's own Authorization header" },
    { path = "curl::easy::Easy::password", reason = "credentials travel only in the client's own Authorization header" },
    { path = "curl::easy::Easy2::password", reason = "credentials travel only in the client's own Authorization header" },
    { path = "curl::easy::Easy::http_auth", reason = "no curl auth scheme runs (Negotiate would offer the user's Kerberos ticket)" },
    { path = "curl::easy::Easy2::http_auth", reason = "no curl auth scheme runs (Negotiate would offer the user's Kerberos ticket)" },
    { path = "curl::easy::Easy::aws_sigv4", reason = "credentials travel only in the client's own Authorization header" },
    { path = "curl::easy::Easy2::aws_sigv4", reason = "credentials travel only in the client's own Authorization header" },
