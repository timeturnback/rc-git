    { path = "curl::easy::Easy::proxy_password", reason = "no credential goes to a proxy" },
    { path = "curl::easy::Easy2::proxy_password", reason = "no credential goes to a proxy" },
    # The request connects to the address the system resolves the URL's host to, so TLS is not
    # the only thing between the token and another machine.
    { path = "curl::easy::Easy::connect_to", reason = "the request connects to its URL's own host" },
    { path = "curl::easy::Easy2::connect_to", reason = "the request connects to its URL's own host" },
    { path = "curl::easy::Easy::resolve", reason = "the request connects to its URL's own host" },
    { path = "curl::easy::Easy2::resolve", reason = "the request connects to its URL's own host" },
    { path = "curl::easy::Easy::doh_url", reason = "the request connects to its URL's own host, resolved by the system" },
    { path = "curl::easy::Easy2::doh_url", reason = "the request connects to its URL's own host, resolved by the system" },
    { path = "curl::easy::Easy::dns_servers", reason = "the request connects to its URL's own host, resolved by the system" },
    { path = "curl::easy::Easy2::dns_servers", reason = "the request connects to its URL's own host, resolved by the system" },
    { path = "curl::easy::Easy::unix_socket", reason = "the request connects to its URL's own host" },
    { path = "curl::easy::Easy2::unix_socket", reason = "the request connects to its URL's own host" },
    { path = "curl::easy::Easy::unix_socket_path", reason = "the request connects to its URL's own host" },
    { path = "curl::easy::Easy2::unix_socket_path", reason = "the request connects to its URL's own host" },
    # gix-transport's own HTTP client sends any header to any URL. Fetch and push reach it only
    # through the banned connect entry points above, with http_options in actions/remote.rs.
    { path = "gix_transport::client::blocking_io::http::connect", reason = "network entry point; HTTPS fetch and push go through rc-git-guard actions/remote with http_options" },
    { path = "gix_transport::client::blocking_io::http::Transport::new", reason = "network entry point; HTTPS fetch and push go through rc-git-guard actions/remote with http_options" },
    { path = "gix_transport::client::blocking_io::http::Transport::new_http", reason = "network entry point; HTTPS fetch and push go through rc-git-guard actions/remote with http_options" },
    { path = "gix_transport::client::blocking_io::http::Http::get", reason = "sends any header to any URL; GitHub API calls go through rc-git-guard actions/remote/github/http.rs" },
    { path = "gix_transport::client::blocking_io::http::Http::post", reason = "sends any header to any URL; GitHub API calls go through rc-git-guard actions/remote/github/http.rs" },
    { path = "gix_transport::client::blocking_io::http::Http::configure", reason = "sets the transport's TLS, proxy and credential options; only http_options in rc-git-guard actions/remote.rs may" },
]

# gix-transport's curl client, named: building one, or a transport over it, is a request to any
# URL with any header outside the guard's checks.
disallowed-types = [
    { path = "gix_transport::client::blocking_io::http::curl::Curl", reason = "an HTTP client outside the guard; fetch and push reach it only through the banned connect entry points" },
]

# Unit tests may unwrap/panic; library code may not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Hard limit: at most 5 positional parameters per function.
too-many-arguments-threshold = 5
