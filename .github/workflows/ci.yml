name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install   # the channel and components in rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - name: cargo clippy   # same check as check.sh: a ban path resolving to nothing only warns
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --exclude rc-git-kit --exclude rc-git-app --exclude rc-git-mac \
            --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          if grep -q 'does not refer to a reachable' "$RUNNER_TEMP/clippy.log"; then
            echo 'error: clippy.toml names a path that resolves to nothing;' \
              'fix it or mark it allow-invalid with a reason' >&2
            exit 1
          fi
      - name: core standalone   # same check as check.sh: no guard transport features unified in
        run: cargo check --locked -p rc-git-core --all-targets
      - run: cargo test --locked --workspace --exclude rc-git-kit --exclude rc-git-app --exclude rc-git-mac   # GPUI crates: macOS job
      - run: |
          cargo doc --locked --workspace --exclude rc-git-kit --exclude rc-git-app --exclude rc-git-mac \
            --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked   # cargo-deny's default plus a lock check

  mac:
    name: macOS app
    runs-on: xcode-27   # the only GitHub-hosted image that ships Xcode 27, the documented floor
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - run: rustup toolchain install   # the channel and components in rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --workspace   # fixtures under macOS git config and APFS
      - name: GPUI crates   # macOS only; excluded from the Linux job
        run: |
          cargo clippy --locked -p rc-git-kit -p rc-git-app -p rc-git-mac --all-targets --all-features -- -D warnings
          cargo doc --locked -p rc-git-kit -p rc-git-app -p rc-git-mac --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: scripts/build-app.sh

  scripts:
    name: Scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # changelog-check.sh reads the whole pushed range
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: shellcheck@0.11.0,shfmt@3.13.1,zizmor@1.25.0   # the versions check.sh runs locally
      - name: Install actionlint   # install-action has no actionlint manifest
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "$SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: shellcheck scripts/*.sh scripts/tests/*.sh
      - run: shfmt -d scripts/*.sh scripts/tests/*.sh
      - run: actionlint
      - run: zizmor --offline .github
      - run: scripts/tests/changelog-check.test.sh
      - run: scripts/changelog-check.sh "$RANGE"
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
