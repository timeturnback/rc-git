version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gix:
        patterns: ["gix", "gix-*"]
      tree-sitter:
        patterns: ["tree-sitter", "tree-sitter-highlight"]
      rust-patch:
        patterns: ["*"]
        exclude-patterns: ["gix", "gix-*", "tree-sitter", "tree-sitter-highlight"]
        update-types: ["patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
