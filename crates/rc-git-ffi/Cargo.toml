[package]
name = "rc-git-ffi"
description = "C ABI over rc-git-core for the Swift app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
rc-git-core.workspace = true
rc-git-guard.workspace = true
rc-git-highlight.workspace = true

[dev-dependencies]
rc-git-testkit.workspace = true

# Not `workspace = true`: the workspace forbids unsafe_code and this crate is the
# one place it is allowed. Every other lint mirrors the workspace table, and the
# "lint tables" step in scripts/check.sh fails when the two drift.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
