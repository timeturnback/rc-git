[package]
name = "rc-git-mac"
description = "Live macOS implementations of the rc-git-kit platform traits: CFPreferences, the login keychain, FSEvents, and a bounded process runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rc-git-kit.workspace = true
# Already in the build through rc-git-kit; the live update environment implements a kit trait
# whose calls take `App` and return `Task`.
gpui.workspace = true

[dev-dependencies]
rc-git-core.workspace = true
rc-git-testkit.workspace = true
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }

# Not `workspace = true`: the workspace forbids unsafe_code and this crate binds the system
# frameworks, so it is a hand copy of the workspace lint table to keep in sync. It drops
# `unsafe_code` and adds `unsafe_op_in_unsafe_fn` and `undocumented_unsafe_blocks`; the
# "lint tables" step in scripts/check.sh fails when the two drift.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
