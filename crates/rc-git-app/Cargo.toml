[package]
name = "rc-git-app"
description = "The rc-git macOS app on GPUI: windows, views, menus and key bindings over rc-git-kit models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "RCGit"
path = "src/main.rs"

[dependencies]
rc-git-kit.workspace = true
rc-git-highlight.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
anyhow.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_apple.workspace = true

[lints]
workspace = true
