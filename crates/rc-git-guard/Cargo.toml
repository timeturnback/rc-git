[package]
name = "rc-git-guard"
description = "Policy engine that classifies git actions and decides what confirmation they need"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gix = { workspace = true, features = ["blocking-http-transport-curl"] }
gix-protocol.workspace = true
gix-packetline.workspace = true
gix-pack.workspace = true
rc-git-core.workspace = true
thiserror.workspace = true
russh.workspace = true
russh-config.workspace = true
tokio.workspace = true

[dev-dependencies]
rc-git-testkit.workspace = true
# Tests talk Basic auth to the loopback HTTP server; production builds keep the
# clear-text refusal because this feature is dev-only.
gix-transport = { workspace = true, features = ["http-client-insecure-credentials"] }

[lints]
workspace = true
