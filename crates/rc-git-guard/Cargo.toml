[package]
name = "rc-git-guard"
description = "Policy for every mutating action, and rc-git's only write and network path"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
gix = { workspace = true, features = ["blocking-http-transport-curl"] }
gix-pack.workspace = true
rc-git-core.workspace = true
thiserror.workspace = true
russh.workspace = true
russh-config.workspace = true
hmac.workspace = true
sha1.workspace = true
tokio.workspace = true
curl.workspace = true
serde_json.workspace = true

[features]
# Plain http to a loopback GitHub host, so the CLI's tests can sign in against the fake server.
# Dev-only: enabled from [dev-dependencies] alone, and scripts/check.sh fails when a normal build
# of the app or the CLI carries it. The guard's own unit tests get the same allowance from
# cfg(test).
dev-loopback-http = []
# `actions::github::testing`: the exact request bodies the pull request reads send, for other crates'
# tests that script the testkit's fake GitHub host. Dev-only like dev-loopback-http, and
# scripts/check.sh fails a normal app or CLI build that carries it.
test-support = []

[dev-dependencies]
rc-git-testkit.workspace = true
# Tests talk Basic auth to the loopback HTTP server; production builds keep the
# clear-text refusal because this feature is dev-only.
gix-transport = { workspace = true, features = ["http-client-insecure-credentials"] }

[lints]
workspace = true
