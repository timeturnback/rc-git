[package]
name = "rc-git-kit"
description = "App state and pure text logic for the rc-git UI: models, markdown, search, layout policy. No widgets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
# The fakes in `fake`, for this crate's integration tests and the crates above it.
test-support = []

[dependencies]
rc-git-core.workspace = true
rc-git-guard.workspace = true
rc-git-highlight.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
jsonc-parser.workspace = true
gpui.workspace = true

[dev-dependencies]
# Itself with the fakes on, so `cargo test -p rc-git-kit` builds them for tests/.
rc-git-kit = { path = ".", features = ["test-support"] }
rc-git-testkit.workspace = true
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
