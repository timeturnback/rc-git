[package]
name = "rc-git-testkit"
description = "Throwaway git repositories for tests; the only crate that runs the git CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
tempfile.workspace = true
russh.workspace = true
tokio = { workspace = true, features = ["process", "macros"] }

# Not `workspace = true`: test support drops the panic-prevention group (unwrap_used,
# expect_used, panic, panic_in_result_fn, unimplemented) because a broken fixture must fail
# loudly. Every other lint mirrors the workspace table, and the "lint tables" step in
# scripts/check.sh fails when the two drift.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Safety
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
