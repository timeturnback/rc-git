[package]
name = "rc-git-cli"
description = "Command-line front end over rc-git-core reads, rc-git-guard actions, and rc-git-highlight, for scripts, agents, and benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rc-git"
path = "src/main.rs"

[dependencies]
rc-git-core.workspace = true
rc-git-guard.workspace = true
rc-git-highlight.workspace = true
# `auth`: the app's account settings and token keeper (kit) and its keychain (mac), so the CLI
# and the app share one set of GitHub accounts.
rc-git-kit.workspace = true
rc-git-mac.workspace = true
anyhow.workspace = true
signal-hook.workspace = true

[dev-dependencies]
rc-git-testkit.workspace = true
# `auth` tests sign in against the testkit's fake GitHub host over plain http on loopback;
# dev-only, so a normal build speaks https to every host (scripts/check.sh checks).
rc-git-guard = { workspace = true, features = ["dev-loopback-http", "test-support"] }
# Tests talk Basic auth to the loopback HTTP server; release builds keep the
# clear-text refusal because this feature is dev-only.
gix-transport = { workspace = true, features = ["http-client-insecure-credentials"] }

[lints]
workspace = true
